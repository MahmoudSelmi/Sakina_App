name: quran_premium
description: Flagship Quran listening experience
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.5
  dio: ^5.4.3
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  shared_preferences: ^2.2.3
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  get_it: ^7.7.0
  rxdart: ^0.27.7
  url_launcher: ^6.3.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reciters/
    - assets/branding/
